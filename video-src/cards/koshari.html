<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../base.css"><link rel="stylesheet" href="card.css">
<style>
.eyebrow{margin-top:70px}.h2{margin-top:20px;font-size:92px}
.bowl{font-size:180px;margin-top:20px}
.lists{display:grid;grid-template-columns:1fr 1fr;gap:30px;width:900px;margin-top:30px}
.lists .card{align-items:flex-start;justify-content:flex-start;padding:40px 44px;gap:14px;height:400px}
.lists h4{font-family:GMono,monospace;font-size:26px;letter-spacing:.14em;color:var(--brand);font-weight:500}
.lists .no h4{color:var(--muted)}
.lists li{list-style:none;font-size:38px;font-weight:600;letter-spacing:-.02em;line-height:1.5}
.lists .no li{color:var(--muted);text-decoration:line-through;text-decoration-thickness:3px}
</style></head><body><div class="stage">
<div class="eyebrow mono">Egyptian kitchen swap</div>
<div class="h2">Koshari, your way.</div>
<div class="emoji bowl">🍚</div>
<div class="lists">
 <div class="card"><h4>KEEP</h4><ul><li>Rice &amp; lentils</li><li>Pasta &amp; chickpeas</li><li>Crispy onions</li><li>Extra da'ah + lemon</li></ul></div>
 <div class="card no"><h4>SKIP</h4><ul><li>Tomato salsa</li><li>Shatta</li></ul></div>
</div>
<div class="foot mono">@nightshade.health</div>
</div>
<script src="card.js"></script></body></html>
